name: Rebuild Figranium Dify package

on:
  push:
    paths:
      - .github/workflows/rebuild-figranium-package.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout marketplace fork
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Checkout Figranium Dify source
        uses: actions/checkout@v4
        with:
          repository: figranium/figranium-dify
          ref: 953236f662c2cdd93ece77b4e880494d6da2a6e6
          path: plugin-source

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Download Dify plugin daemon
        run: |
          gh release download -R langgenius/dify-plugin-daemon --pattern 'dify-plugin-linux-amd64' --dir /tmp
          chmod +x /tmp/dify-plugin-linux-amd64
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build plugin package
        run: |
          /tmp/dify-plugin-linux-amd64 plugin package plugin-source --output_path /tmp/figranium-0.0.1.difypkg
          mkdir -p Figranium
          cp /tmp/figranium-0.0.1.difypkg Figranium/figranium-0.0.1.difypkg

      - name: Commit rebuilt package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Figranium/figranium-0.0.1.difypkg
          git diff --cached --quiet && exit 0
          git commit -m 'fix: rebuild Figranium plugin package with requirements'
          git push origin HEAD:main
