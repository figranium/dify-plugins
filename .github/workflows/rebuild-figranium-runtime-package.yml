name: Rebuild Figranium runtime package

on:
  push:
    paths:
      - .github/workflows/rebuild-figranium-runtime-package.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout plugin source
        uses: actions/checkout@v4
        with:
          repository: figranium/figranium-dify
          ref: b29ab078c5fa159323870319fb5b61f393642f92
          path: plugin-source

      - name: Download Dify plugin daemon
        run: |
          gh release download -R langgenius/dify-plugin-daemon --pattern 'dify-plugin-linux-amd64' --dir /tmp
          chmod +x /tmp/dify-plugin-linux-amd64
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build package without uv
        run: |
          command -v uv && exit 1 || true
          /tmp/dify-plugin-linux-amd64 plugin package plugin-source --output_path /tmp/figranium-0.0.1.difypkg
          unzip -l /tmp/figranium-0.0.1.difypkg | tee /tmp/package-list.txt
          ! grep -q 'pyproject.toml' /tmp/package-list.txt
          ! grep -q 'uv.lock' /tmp/package-list.txt
          grep -q 'requirements.txt' /tmp/package-list.txt

      - name: Emulate Dify marketplace repack without uv
        run: |
          mkdir /tmp/unpacked
          unzip -q /tmp/figranium-0.0.1.difypkg -d /tmp/unpacked
          command -v uv && exit 1 || true
          /tmp/dify-plugin-linux-amd64 plugin package /tmp/unpacked --output_path /tmp/repacked.difypkg

      - name: Commit package
        run: |
          cp /tmp/figranium-0.0.1.difypkg Figranium/figranium-0.0.1.difypkg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Figranium/figranium-0.0.1.difypkg
          git commit -m 'fix: submit runtime-only Figranium package'
          git push origin HEAD:main
